name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ၁။ MainActivity.kt ဖိုင် အဆင်သင့်ရှိစေရန် အနည်းငယ်သာ ပြင်ပေးခြင်း
      - name: Ensure MainActivity Setup
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

      # ၂။ Flutter Dependency များ ရယူခြင်း
      - name: Install Dependencies
        run: flutter pub get

      # ၃။ Android Build Configurations များကို Auto-Fix လုပ်၍ APK Build ခြင်း
      - name: Build APK (Release)
        run: |
          flutter config --enable-android
          flutter build apk --release --android-skip-build-dependency-validation

      # ၄။ ရရှိလာသော APK ကို Artifact အဖြစ် Upload တင်ပေးခြင်း
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
