name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # MainActivity.kt ကို Import Error မတက်မည့် Native Code ဖြင့် အစားထိုးခြင်း
      - name: Clean Fix MainActivity
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import android.app.Activity

          class MainActivity: Activity()
          EOF
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
