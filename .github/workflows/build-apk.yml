name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ၁။ MainActivity.kt နှင့် Generated File များ သန့်ရှင်းရေးလုပ်ခြင်း
      - name: Fix MainActivity & Reset Generated Plugins
        run: |
          # MainActivity.kt ကို Standard Flutter Engine နှင့် ပြန်ပြင်ခြင်း
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

          # ကြိုတင် ပါလာသော Classpath မကိုက်သည့် Generated File ကို ဖြတ်ထုတ်ခြင်း
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      # ၂။ Dependency များနှင့် Flutter Plugin Binding များကို သန့်ရှင်းစွာ Auto-Generate ပြုလုပ်ခြင်း
      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      # ၃။ APK Build ပြုလုပ်ခြင်း
      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      # ၄။ APK Upload တင်ခြင်း
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
