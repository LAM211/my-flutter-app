name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Android Settings & Flutter Embedding Direct Patch
      - name: Patch Android Project Settings
        run: |
          # 1. MainActivity.kt ကို သန့်ရှင်းအောင် ပြန်ပြင်ခြင်း
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            mkdir -p $(dirname "$MAIN_ACT")
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

          # 2. settings.gradle.kts ထဲသို့ Flutter Plugin Auto-Apply လုပ်ခြင်း
          if [ -f "android/settings.gradle.kts" ]; then
            cat << 'EOF' > android/settings.gradle.kts
          pluginManagement {
              def devFlutterSdkPath = settings.extra["flutter.sdk"]
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }

          include(":app")
          EOF
          fi

          # 3. android/app/build.gradle.kts သို့ Flutter Engine Plugins ထည့်ပေးခြင်း
          if [ -f "android/app/build.gradle.kts" ]; then
            cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.akariz.chat"
              compileSdk = 34

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.akariz.chat"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
