name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-fix MainActivity.kt
        run: |
          MAIN_ACTIVITY=$(find . -name "MainActivity.kt")
          if [ -f "$MAIN_ACTIVITY" ]; then
            echo "Fixing MainActivity.kt automatically..."
            echo -e "package com.akariz.chat\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}" > "$MAIN_ACTIVITY"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
