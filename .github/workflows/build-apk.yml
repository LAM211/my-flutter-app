name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Fresh Android Template + SDK 36 + Desugar 2.1.4 + Safe Python Manifest Patch
      - name: Rebuild Android Project & Patch Manifest
        run: |
          # 1. Android folder အဟောင်းကို ဖျက်မည်
          rm -rf android

          # 2. Android template အသစ်ထုတ်မည်
          flutter create . --platforms=android --org=com.akariz

          # 3. MainActivity.kt ပြင်ဆင်မည်
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

          # 4. build.gradle (compileSdk 36 & desugar 2.1.4)
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.akariz.chat"
              compileSdk 36

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId "com.akariz.chat"
                  minSdk 21
                  targetSdk 36
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF

          # 5. Python ဖြင့် XML Format မပျက်အောင် Permissions နှင့် App Name ထည့်ခြင်း
          python3 -c '
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          """

          # Insert permissions right inside <manifest>
          content = re.sub(r"(<manifest[^>]*>)", r"\1\n" + permissions, content)

          # Change App Label to AkarizChat
          content = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"AkarizChat\"", content)

          with open(manifest_path, "w") as f:
              f.write(content)
          '

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AkarizChat-V1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/AkarizChat-V1.apk
