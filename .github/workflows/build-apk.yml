name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ပျက်စီးနေသော android folder အဟောင်းကို ဖျက်ပြီး Fresh Android Project ပြန်ဆောက်ခြင်း
      - name: Rebuild Fresh Android Project
        run: |
          # 1. android folder ဟောင်းကို အကုန်ဖျက်ပစ်မည်
          rm -rf android

          # 2. Flutter Stable Engine ဖြင့် android folder အသစ်စက်စက် ပြန်ထုတ်မည်
          flutter create . --platforms=android --org=com.akariz

          # 3. MainActivity.kt ကို သန့်ရှင်းစွာ ချိန်ပေးမည်
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
