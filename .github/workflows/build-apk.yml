name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # FlutLab/Project အဟောင်း၏ Android Template ကို Flutter Official Engine ဖြင့် Recreate လုပ်ခြင်း
      - name: Reconstruct Android Project Template
        run: |
          # 1. ပျက်စီး/ကျန်ခဲ့သော Generated File များကို ရှင်းထုတ်ခြင်း
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

          # 2. Android Folder ကို Flutter Standard Structure ဖြင့် Auto Re-create လုပ်ခြင်း
          flutter create . --platforms=android --org=com.akariz

          # 3. MainActivity.kt ကို Standard Flutter Embedding ပြန်ချိန်ပေးခြင်း
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
