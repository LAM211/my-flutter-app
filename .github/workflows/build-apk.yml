name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Fresh Android Template + Desugaring Fix (For ota_update)
      - name: Rebuild Android Project & Fix Desugaring
        run: |
          # 1. Android folder အဟောင်းကို ဖျက်မည်
          rm -rf android

          # 2. Template အသစ်ထုတ်မည်
          flutter create . --platforms=android --org=com.akariz

          # 3. MainActivity.kt ချိန်ပေးမည်
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

          # 4. ota_update အတွက် Core Library Desugaring ထည့်ပေးခြင်း
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' "$GRADLE_FILE"
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' "$GRADLE_FILE"
          fi

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
