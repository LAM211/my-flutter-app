name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Gradle & MainActivity Embedding Fix
      - name: Auto-fix Gradle and MainActivity
        run: |
          # 1. MainActivity.kt ပြင်ခြင်း
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null)
          if [ -f "$MAIN_ACT" ]; then
            echo "Fixing MainActivity.kt..."
            cat << 'EOF' > "$MAIN_ACT"
          package com.akariz.chat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

          # 2. build.gradle.kts ထဲသို့ Flutter Embedding/Java Compatibility ဖြည့်ပေးခြင်း
          APP_GRADLE="android/app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q "compileSdk" "$APP_GRADLE"; then
              echo "Fixing build.gradle.kts..."
              cat << 'EOF' >> "$APP_GRADLE"

          android {
              compileSdk = 34
              defaultConfig {
                  minSdk = 21
                  targetSdk = 34
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
            fi
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkarizChat-v1.0
          path: build/app/outputs/flutter-apk/app-release.apk
